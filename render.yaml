services:
  - type: web
    name: diario-de-aula-web
    runtime: static
    autoDeployTrigger: commit
    rootDir: Web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - Web/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
  - type: web
    name: diario-de-aula-api
    runtime: node
    autoDeployTrigger: commit
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: Api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: diario-de-aula-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: diario-de-aula-db
    databaseName: diario_de_aula
    user: diario_de_aula
    region: oregon
    plan: free
