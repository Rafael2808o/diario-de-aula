services:
  - type: web
    name: diario-de-aula-web
    runtime: static
    autoDeployTrigger: commit
    rootDir: Web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - Web/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
  - type: web
    name: diario-de-aula-api
    runtime: node
    autoDeployTrigger: commit
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: Api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      # PostgreSQL no Neon (plano gratuito sem expiração). Valor definido no painel, nunca no Git.
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://diario-de-aula-web.vercel.app
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
