name: Limpeza da Comunidade

# Apaga cartinhas (48 h) e fotos do Feed (24 h) vencidas, mesmo quando ninguém abre o app.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a limpeza da API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --max-time 90 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://diario-de-aula-api.onrender.com/api/v1/internal/purge
