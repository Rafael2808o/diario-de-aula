    <meta property="og:title" content="Lúmina — assistente de estudos" />

    <title>Lúmina — assistente de estudos</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando piscar claro no modo escuro.
      try {
        var theme = localStorage.getItem("lumina.theme");
        if (theme === "escuro") document.documentElement.dataset.theme = "dark";
        if (theme === "claro") document.documentElement.dataset.theme = "light";
        document.documentElement.dataset.accent = localStorage.getItem("lumina.accent") || "lavanda";
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
